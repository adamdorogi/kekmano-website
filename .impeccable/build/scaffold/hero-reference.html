<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: a-white.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lemonada:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f4f8f8}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <div class="r-utility region chrome" data-region="utility"><!-- navy utility bar --></div>
  <div class="r-location region text" data-region="location"><!-- Budapest és Pest megye --><p style="font-size:var(--r-location-font);line-height:1.05;margin:0">location</p></div>
  <div class="r-hours region text" data-region="hours"><!-- 0–24, hétvégén és ünnepnapokon is --><p style="font-size:var(--r-hours-font);line-height:1.05;margin:0">hours</p></div>
  <figure class="r-brand-logo region plate" data-region="brand-logo"><img src="../../../assets/plates/brand-logo.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-navigation region text" data-region="navigation"><!-- Szolgáltatások Rólunk Referenciák Kapcsolat --><p style="font-size:var(--r-navigation-font);line-height:1.05;margin:0">navigation</p></div>
  <div class="r-header-call region control" data-region="header-call"><!-- +36 30 822 0869: rebuild the control's chrome from the crop (comp-spec.mjs --crop header-call); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-headline region text" data-region="headline"><!-- Dugulás van? Mi megoldjuk. --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <div class="r-intro region text" data-region="intro"><!-- Duguláselhárítás, WOMA csatornatisztítás és kamerás vizsgálat Budapesten és Pest megyében. Gyorsan, tisztán, garanciával. --><p style="font-size:var(--r-intro-font);line-height:1.05;margin:0">intro</p></div>
  <div class="r-hero-call region control" data-region="hero-call"><!-- +36 30 822 0869: rebuild the control's chrome from the crop (comp-spec.mjs --crop hero-call); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-hero-quote region control" data-region="hero-quote"><!-- Ajánlatot kérek: rebuild the control's chrome from the crop (comp-spec.mjs --crop hero-quote); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-reviews region text" data-region="reviews"><!-- Google 5,0 stars 1000+ ügyfélvélemény --><p style="font-size:var(--r-reviews-font);line-height:1.05;margin:0">reviews</p></div>
  <figure class="r-hero-photo region plate" data-region="hero-photo"><img src="../../../assets/plates/hero-photo.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-service-hours region control" data-region="service-hours"><!-- navy circular 0–24 hours badge: rebuild the control's chrome from the crop (comp-spec.mjs --crop service-hours); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-photo-caption region text" data-region="photo-caption"><!-- Csepregi Gyuri · Szakértelem 2004 óta --><p style="font-size:var(--r-photo-caption-font);line-height:1.05;margin:0">photo-caption</p></div>
  <div class="r-benefit-band region chrome" data-region="benefit-band"><!-- ice blue reassurance strip --></div>
  <div class="r-benefit-speed region text" data-region="benefit-speed"><!-- Akár 1–2 órán belül. Gyors kiszállás Budapesten és Pest megyében. --><p style="font-size:var(--r-benefit-speed-font);line-height:1.05;margin:0">benefit-speed</p></div>
  <div class="r-benefit-price region text" data-region="benefit-price"><!-- Előre egyeztetett árak. Nincsenek rejtett költségek. --><p style="font-size:var(--r-benefit-price-font);line-height:1.05;margin:0">benefit-price</p></div>
  <div class="r-benefit-warranty region text" data-region="benefit-warranty"><!-- Garanciával dolgozunk. Szakszerű munkavégzés, hosszú távú megoldások. --><p style="font-size:var(--r-benefit-warranty-font);line-height:1.05;margin:0">benefit-warranty</p></div>
  <div class="r-service-heading region text" data-region="service-heading"><!-- Miben segíthetünk? --><p style="font-size:var(--r-service-heading-font);line-height:1.05;margin:0">service-heading</p></div>
  <figure class="r-drain-photo region plate" data-region="drain-photo"><img src="../../../assets/plates/drain-photo.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-woma-photo region plate" data-region="woma-photo"><img src="../../../assets/plates/woma-photo.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-camera-photo region plate" data-region="camera-photo"><img src="../../../assets/plates/camera-photo.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
</main>
</body>
</html>
